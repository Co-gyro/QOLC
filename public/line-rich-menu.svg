<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
  <!-- 背景: QOLCプライマリ緑 -->
  <rect width="2500" height="1686" fill="#4C986A"/>
  <!-- セル境界（白25%の細線） -->
  <g stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3">
    <line x1="1250" y1="120" x2="1250" y2="1566"/>
    <line x1="200" y1="843" x2="2300" y2="843"/>
  </g>

  <!-- アイコン共通スタイル: 白線・塗りなし。scale(9)内なので線幅はスケール前値(≈1.6×9=14px) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左上: ホーム (home) 中心(625,361) scale9 -->
    <g transform="translate(517,253) scale(9)">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <path d="M9 22V12h6v10"/>
    </g>
    <!-- 右上: ご利用明細 (file-text) 中心(1875,361) -->
    <g transform="translate(1767,253) scale(9)">
      <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
      <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
      <path d="M16 13H8"/>
      <path d="M16 17H8"/>
      <path d="M10 9H8"/>
    </g>
    <!-- 左下: 領収書 (receipt) 中心(625,1204) -->
    <g transform="translate(517,1096) scale(9)">
      <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/>
      <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/>
      <path d="M12 17.5v-11"/>
    </g>
    <!-- 右下: カード管理 (credit-card) 中心(1875,1204) -->
    <g transform="translate(1767,1096) scale(9)">
      <rect width="20" height="14" x="2" y="5" rx="2"/>
      <line x1="2" y1="10" x2="22" y2="10"/>
    </g>
  </g>

  <!-- ラベル -->
  <g fill="#FFFFFF" font-weight="700" font-size="86" text-anchor="middle">
    <text x="625"  y="560">ホーム</text>
    <text x="1875" y="560">ご利用明細</text>
    <text x="625"  y="1403">領収書</text>
    <text x="1875" y="1403">カード管理</text>
  </g>
</svg>
